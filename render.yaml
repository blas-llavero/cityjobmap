services:
  - type: web
    name: cityjobmap-api
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    rootDir: services/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: CITYJOBMAP_ALLOWED_ORIGINS
        value: https://blasllavero.com,https://blas-llavero.github.io
